[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-counter"
version = "0.2.0"
description = "Estimate LLM token counts and API costs before you send a request. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = ["llm", "tokens", "cost-estimation", "claude", "openai", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.17.4,<0.18", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Viprasol-Tech/token-counter"
Repository = "https://github.com/Viprasol-Tech/token-counter"
Issues = "https://github.com/Viprasol-Tech/token-counter/issues"
Website = "https://viprasol.com"

[project.scripts]
token-counter = "token_counter.core:main"

[tool.hatch.build.targets.wheel]
packages = ["token_counter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
